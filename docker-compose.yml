services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-5001}:8080"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - cez-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - cez-network

  show-urls:
    image: alpine:latest
    container_name: cez-info
    # These variables are passed to the container from your host (or default values)
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-5001}
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
    # We use $$ to tell Docker Compose to pass the variable through to the shell
    command: >
      sh -c "
      sleep 2;
      echo '';
      echo '========================================================================';
      echo '   🚀 CEZ3.0 IS READY (WITH HOT RELOAD)!';
      echo '========================================================================';
      echo \"   🌐 Frontend:     http://localhost:$${FRONTEND_PORT}\";
      echo \"   🔌 Backend:      http://localhost:$${BACKEND_PORT}\";
      echo \"   📄 API Docs:     http://localhost:$${BACKEND_PORT}/scalar/v1\";
      echo '========================================================================';
      echo '';
      "
    depends_on:
      - backend
      - frontend
    networks:
      - cez-network
    restart: "no"

networks:
  cez-network:
    driver: bridge