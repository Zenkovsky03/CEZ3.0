services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    env_file:
      - ./backend/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - cez-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: base # 👈 Uses the 'base' stage (Node.js) instead of Nginx
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app          # 👈 Syncs your code to container
      - /app/node_modules        # 👈 Keeps container dependencies safe
    command: npm run dev         # 👈 Runs the dev server
    depends_on:
      - backend
    networks:
      - cez-network

  show-urls:
    image: alpine:latest
    container_name: cez-info
    command: >
      sh -c "
      sleep 2;
      echo '';
      echo '=========================================================';
      echo '   🚀 CEZ3.0 IS READY (WITH HOT RELOAD)!';
      echo '=========================================================';
      echo '   🌐 Frontend:     http://localhost:3000';
      echo '   🔌 Backend:      http://localhost:5001';
      echo '   📄 API Docs:     http://localhost:5001/scalar/v1';
      echo '=========================================================';
      echo '';
      "
    depends_on:
      - backend
      - frontend
    networks:
      - cez-network
    restart: "no"

networks:
  cez-network:
    driver: bridge